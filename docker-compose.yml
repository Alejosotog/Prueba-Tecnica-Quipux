services:

  mongodb:
    image: mongo:8
    container_name: quipux-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: quipux-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: quipux
      RABBITMQ_DEFAULT_PASS: quipux123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
    container_name: quipux-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: earthquake_db
    depends_on:
      - mongodb

  ingestion:
    build:
      context: ./src
    container_name: quipux-ingestion
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: earthquake_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: quipux
      RABBITMQ_PASSWORD: quipux123
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "services.ingestion_runner"]

  event_processor:
    build:
      context: ./src
    container_name: quipux-event-processor
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: earthquake_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: quipux
      RABBITMQ_PASSWORD: quipux123
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "messaging.rabbitmq_consumer"]

  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: quipux-airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: earthquake_db
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "pymongo requests pydantic pydantic-settings"
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/services:/opt/airflow/services
      - ./src/database:/opt/airflow/database
      - ./src/models:/opt/airflow/models
      - ./src/utils:/opt/airflow/utils
      - ./src/clients:/opt/airflow/clients
      - ./src/config.py:/opt/airflow/config.py
    depends_on:
      - mongodb
    command: bash -c "airflow db migrate && airflow scheduler"


  prometheus:
    image: prom/prometheus:latest
    container_name: quipux-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: quipux-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  grafana_data:
